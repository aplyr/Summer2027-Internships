name: Update listings

on:
  schedule:
    # Daily, 13:17 UTC (morning in the U.S.). Off the top of the hour to
    # dodge GitHub's scheduled-run congestion.
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write even if the export shrank sharply (outage guard)'
        type: boolean
        default: false

# The built-in GITHUB_TOKEN pushes the commit; no personal token needed.
permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate README
        run: node scripts/generate.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md data; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
